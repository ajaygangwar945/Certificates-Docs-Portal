<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificates & Docs Portal</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23818cf8;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%23c084fc;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='3' y='4' width='18' height='16' rx='2' fill='url(%23grad)' /%3E%3Cpath d='M7 8h10M7 12h10M7 16h5' stroke='white' stroke-width='1.5' stroke-linecap='round' /%3E%3Ccircle cx='17' cy='16' r='3' fill='%23f472b6' stroke='white' stroke-width='1' /%3E%3C/svg%3E">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Background Effects -->
    <div class="noise"></div>
    <div class="background">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <!-- Header Section -->
        <header>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">
                <i class="fas fa-moon"></i>
            </button>
            <h1>
                <svg class="header-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect x="3" y="4" width="18" height="16" rx="2" fill="url(#headerGrad)" />
                    <path d="M7 8h10M7 12h10M7 16h5" stroke="white" stroke-width="1.5" stroke-linecap="round" />
                    <circle cx="17" cy="16" r="3" fill="#f472b6" stroke="white" stroke-width="1" />
                </svg>Certificates & Docs Portal
            </h1>
            <p class="subtitle">A curated collection of my professional certifications, awards, and learning resources.</p>

            <div class="stats-bar" id="statsBar">
                <!-- Data injected via JS -->
            </div>
        </header>

        <!-- Controls Section -->
        <div class="filter-container" id="filterContainer">
            <!-- Data injected via JS -->
        </div>

        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" class="search-input"
                placeholder="Search for certificates, technologies, or topics...">
        </div>

        <!-- Documents Grid -->
        <div class="pdf-grid" id="pdfGrid">
            <!-- Data injected via JS -->
        </div>

        <!-- Footer -->
        <footer>
            <p>Designed & Built by Ajay Gangwar &copy; 2026</p>
        </footer>
    </div>

    <!-- Background Filters -->
    <svg style="display: none;">
        <filter id="noiseFilter">
            <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" stitchTiles="stitch" />
        </filter>
    </svg>

    <!-- Custom Script -->
    <script src="script.js"></script>
</body>

</html>
